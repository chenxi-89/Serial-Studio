name: Deploy

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'
  workflow_dispatch:

env:
  VERSION: "3.2.7-Community"
  QT_VERSION_WINDOWS: 6.9.3
  EXECUTABLE: "Serial-Studio"
  APPLICATION: "Serial Studio"

jobs:
  build-windows:
    runs-on: windows-latest
    name: '🧊 Windows Build'
    steps:
    - run: git config --global core.autocrlf input

    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: '⚙️ Install Qt via aqt'
      shell: pwsh
      run: |
        pip install aqtinstall

        # 写入 aqt 配置文件，指定清华镜像
        $configDir = "$env:APPDATA\aqt"
        New-Item -ItemType Directory -Force -Path $configDir | Out-Null
        Set-Content -Path "$configDir\settings.ini" -Value "[aqt]`nbaseurl: https://mirrors.tuna.tsinghua.edu.cn/qt"

        $QT_DIR = "D:\Qt"
        python -m aqt install-qt windows desktop ${{env.QT_VERSION_WINDOWS}} win64_msvc2022_64 `
          --outputdir $QT_DIR `
          --modules qtcharts qtserialport qtserialbus qtwebsockets qtgraphs qtquick3d qtshadertools qtwebengine

        if ($LASTEXITCODE -ne 0) {
          Write-Host "Tsinghua failed, trying dotsrc..."
          Set-Content -Path "$configDir\settings.ini" -Value "[aqt]`nbaseurl: https://mirrors.dotsrc.org/qtproject"
          python -m aqt install-qt windows desktop ${{env.QT_VERSION_WINDOWS}} win64_msvc2022_64 `
            --outputdir $QT_DIR `
            --modules qtcharts qtserialport qtserialbus qtwebsockets qtgraphs qtquick3d qtshadertools qtwebengine
        }

        if ($LASTEXITCODE -ne 0) { exit 1 }

        $QT_BIN = "$QT_DIR\${{env.QT_VERSION_WINDOWS}}\msvc2022_64\bin"
        $QT_CMAKE = "$QT_DIR\${{env.QT_VERSION_WINDOWS}}\msvc2022_64\lib\cmake"
        echo "$QT_BIN" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "CMAKE_PREFIX_PATH=$QT_CMAKE" >> $env:GITHUB_ENV

    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@latest
      with:
        useLocalCache: true

    - name: '🛠 Setup MSVC'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: '⚙️ Download prebuilt gRPC'
      run: |
        gh release download v1.78.1 -R alex-spataru/gRPC-Builds -p "grpc-1.78.1-windows-x86_64.zip"
        7z x grpc-1.78.1-windows-x86_64.zip -o"${{github.workspace}}\grpc-prefix"
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: '🚧 Configure with CMake (GPL Mode)'
      run: |
        cmake -B build `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${{env.CMAKE_PREFIX_PATH}}" `
          -DPRODUCTION_OPTIMIZATION=ON `
          -DENABLE_HARDENING=ON `
          -DENABLE_GRPC=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CONFIGURATION_TYPES=Release `
          -DBUILD_COMMERCIAL=OFF `
          -DBUILD_GPL3=ON

    - name: '🚧 Build application'
      run: cmake --build build --config Release -j 4

    - name: '📦 Create Portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G ZIP
        mv *.zip ../Serial-Studio-Windows-Portable.zip

    - name: '📤 Upload Result'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-Free-Version
        path: Serial-Studio-Windows-Portable.zip
