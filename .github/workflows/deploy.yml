name: Deploy

on:
  push:
    paths-ignore:
    - '**.md'
  pull_request:
    paths-ignore:
    - '**.md'

  workflow_dispatch:  

env:
  VERSION: "3.2.7-Community"
  QT_VERSION_LINUX: 6.7.0
  QT_VERSION_MACOS: 6.7.0
  QT_VERSION_WINDOWS: 6.7.0
  EXECUTABLE: "Serial-Studio"
  APPLICATION: "Serial Studio"
  UNIXNAME: "serial-studio"
  QML_DIR: "../../app/qml"
  PUBLISHER: "Community"
  # 开启云端自动安装 Qt 环境，解决本地硬盘不足问题
  INSTALL_QT_MACOS: true
  INSTALL_QT_WINDOWS: true
  INSTALL_QT_LINUX_INTEL: true
  INSTALL_QT_LINUX_ARM64: false
  QTFRAMEWORK_BYPASS_LICENSE_CHECK: "true"
  DESCRIPTION: "Multi-purpose serial data visualization & processing program"

jobs:
# -------------------------------------------------------------------------------
# Windows 构建部分 (已修改为 GPL 模式)
# -------------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    name: '🧊 Windows Build'
    steps:
    - run: git config --global core.autocrlf input
    - name: '🧰 Checkout'
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: '⚙️ Install Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{env.QT_VERSION_WINDOWS}}
        host: windows
        target: desktop
        arch: win64_msvc2022_64
        modules: 'qtcharts qtserialport qtserialbus'
        cache: true

    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@latest

    - name: '🛠 Setup MSVC'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: '⚙️ Download prebuilt gRPC'
      run: |
        gh release download v1.78.1 -R alex-spataru/gRPC-Builds -p "grpc-1.78.1-windows-x86_64.zip"
        7z x grpc-1.78.1-windows-x86_64.zip -o"${{github.workspace}}\grpc-prefix"
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: '🚧 Configure with CMake (GPL Mode)'
      run: |
        cmake -B build `
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix" `
          -DPRODUCTION_OPTIMIZATION=ON `
          -DENABLE_HARDENING=ON `
          -DENABLE_GRPC=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_COMMERCIAL=OFF `
          -DBUILD_GPL3=ON

    - name: '🚧 Build application'
      run: cmake --build build --config Release -j 4

    - name: '📦 Create Portable ZIP'
      shell: bash
      run: |
        cd build
        cpack -G ZIP
        mv *.zip ../Serial-Studio-Windows-Portable.zip

    - name: '📤 Upload Result'
      uses: actions/upload-artifact@v4
      with:
        name: Serial-Studio-Free-Version
        path: Serial-Studio-Windows-Portable.zip

# 注意：为了节省篇幅，此处省略了 Linux 和 macOS 部分。
# 如果你也需要这些平台的免费版，请确保在对应的 cmake 配置步骤中
# 同样设置 -DBUILD_COMMERCIAL=OFF -DBUILD_GPL3=ON
